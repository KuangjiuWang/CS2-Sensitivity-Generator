name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - release/version.txt

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm build.spec
      - name: Smoke test packaged app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $app = Start-Process -FilePath ".\dist\CS2-Sensitivity-Generator.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(60000)) {
            Stop-Process -Id $app.Id -Force
            throw "Packaged app did not exit within 60 seconds"
          }
          if ($app.ExitCode -ne 0) { throw "Packaged app exited with code $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: CS2-Sensitivity-Generator-Windows-x64
          path: dist/CS2-Sensitivity-Generator.exe
          if-no-files-found: error

  macos:
    uses: ./.github/workflows/macos.yml

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: CS2-Sensitivity-Generator-*
          merge-multiple: true
          path: assets
      - name: Archive source
        run: git archive --format=zip --prefix=CS2-Sensitivity-Generator/ -o assets/CS2-Sensitivity-Generator-source.zip HEAD
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
            target=(--verify-tag)
          else
            version="$(tr -d '\r\n' < release/version.txt)"
            target=(--target "$GITHUB_SHA")
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$version" "${target[@]}" --title "$version" --generate-notes \
            --notes-file release/notes.md \
            assets/CS2-Sensitivity-Generator.exe \
            assets/CS2-Sensitivity-Generator-macOS-arm64.zip \
            assets/CS2-Sensitivity-Generator-macOS-x86_64.zip \
            assets/CS2-Sensitivity-Generator-source.zip
