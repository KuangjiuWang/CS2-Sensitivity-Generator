name: macOS Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Bundle app
        run: bash scripts/build-macos.sh
      - name: Smoke test packaged app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          executable=dist/CS2-Sensitivity-Generator.app/Contents/MacOS/CS2-Sensitivity-Generator
          test "$(lipo -archs "$executable")" = "${{ matrix.arch }}"
          "$executable" --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: CS2-Sensitivity-Generator-macOS-${{ matrix.arch }}
          path: dist/CS2-Sensitivity-Generator-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
